name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "research/**"]
  pull_request:
    paths-ignore: ["**.md", "research/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Type-checks and builds dist/, which the Tauri crate needs to compile.
      - run: npm run build

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test (TypeScript) with coverage
        if: runner.os == 'Linux'
        run: npm run coverage

      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov

      # Runs the whole workspace test suite; mock-herdr is test scaffolding.
      - name: Test (Rust) with coverage
        if: runner.os == 'Linux'
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --ignore-filename-regex 'mock-herdr' --lcov --output-path coverage/rust.lcov
          cargo llvm-cov report --ignore-filename-regex 'mock-herdr' --summary-only | tee coverage/rust-summary.txt

      - name: Coverage summary
        if: runner.os == 'Linux' && !cancelled()
        run: |
          {
            echo "## Coverage"
            echo "### TypeScript"
            node -e "const t=require('./coverage/ts/coverage-summary.json').total;console.log('| Metric | Covered | Total | % |\n|---|---|---|---|');for(const k of ['lines','statements','functions','branches'])console.log('| '+k+' | '+t[k].covered+' | '+t[k].total+' | '+t[k].pct+'% |')"
            echo "### Rust"
            echo '```'
            cat coverage/rust-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

      # mock-herdr is Unix-only, so Windows compiles just the app.
      - name: Compile app
        if: runner.os == 'Windows'
        run: cargo check -p starfleet --locked
